<svg xmlns="http://www.w3.org/2000/svg" width="3000" height="150">
  <defs>
    <pattern id="stripes" patternUnits="userSpaceOnUse" patternContentUnits="userSpaceOnUse"
             width="20" height="20" patternTransform="rotate(45)">
      <rect width="14" height="20" fill="rgba(220,53,69, 0.4)"/>
      <rect x="14" width="6" height="20" fill="#ffffff"/>
    </pattern>
  </defs>
  <rect width="3000" height="150" fill="url(#stripes)"/>
